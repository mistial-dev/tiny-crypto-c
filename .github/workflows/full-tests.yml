name: Full test suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Full ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: gcc, cc: gcc, cxx: g++}
          - {compiler: clang, cc: clang, cxx: clang++}
    env:
      CTEST_PARALLEL_LEVEL: 4
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Fetch Unicode reference data
        run: |
          mkdir -p "$RUNNER_TEMP/unicode"
          for name in UnicodeData CompositionExclusions NormalizationTest CaseFolding; do
            curl --fail --location --retry 3 "https://www.unicode.org/Public/3.2-Update/$name-3.2.0.txt" -o "$RUNNER_TEMP/unicode/$name-3.2.0.txt"
          done
          for number in 3454 4518; do
            curl --fail --location --retry 3 "https://www.rfc-editor.org/rfc/rfc$number.txt" -o "$RUNNER_TEMP/unicode/rfc$number.txt"
          done
      - name: Full release suite
        run: >-
          make test-full TINY_CRYPTO_TEST_OPENSSL=ON
          TINY_CRYPTO_TEST_UNICODE_DIR="$RUNNER_TEMP/unicode"
      - name: Full sanitizer suite
        run: >-
          make test-sanitize-full
          TINY_CRYPTO_TEST_OPENSSL=ON
          TINY_CRYPTO_TEST_UNICODE_DIR="$RUNNER_TEMP/unicode"
      - name: Full memory sanitizer suite
        if: matrix.compiler == 'clang'
        run: >-
          make test-msan-full
          TINY_CRYPTO_TEST_UNICODE_DIR="$RUNNER_TEMP/unicode"
