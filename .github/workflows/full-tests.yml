name: Full test suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Full ${{ matrix.suite }} (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: release, compiler: gcc, cc: gcc, cxx: g++, target: test-full, openssl: 'ON', timeout: 90}
          - {suite: release, compiler: clang, cc: clang, cxx: clang++, target: test-full, openssl: 'ON', timeout: 90}
          - {suite: sanitizers, compiler: gcc, cc: gcc, cxx: g++, target: test-sanitize-full, openssl: 'ON', timeout: 150}
          - {suite: sanitizers, compiler: clang, cc: clang, cxx: clang++, target: test-sanitize-full, openssl: 'ON', timeout: 150}
          - {suite: memory sanitizer, compiler: clang, cc: clang, cxx: clang++, target: test-msan-full, openssl: 'OFF', timeout: 150}
    env:
      CTEST_PARALLEL_LEVEL: 4
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Fetch Unicode reference data
        run: |
          mkdir -p "$RUNNER_TEMP/unicode"
          for name in UnicodeData CompositionExclusions NormalizationTest CaseFolding; do
            curl --fail --location --retry 3 "https://www.unicode.org/Public/3.2-Update/$name-3.2.0.txt" -o "$RUNNER_TEMP/unicode/$name-3.2.0.txt"
          done
          for number in 3454 4518; do
            curl --fail --location --retry 3 "https://www.rfc-editor.org/rfc/rfc$number.txt" -o "$RUNNER_TEMP/unicode/rfc$number.txt"
          done
      - name: Run full ${{ matrix.suite }} suite
        run: >-
          make "${{ matrix.target }}"
          TINY_CRYPTO_TEST_OPENSSL="${{ matrix.openssl }}"
          TINY_CRYPTO_TEST_UNICODE_DIR="$RUNNER_TEMP/unicode"
